name: Deploy to GitHub Pages

on:
  push:
    branches: [ testing-version-2.12 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build
        # API_KEY secret intentionally removed — app uses BYOK (user supplies
        # their own Gemini key at runtime via the onboarding flow in the app).
        # Self-hosters who want a pre-baked key can still add their own
        # API_KEY secret to their fork and uncomment below:
        # env:
#          API_KEY: ${{ secrets.API_KEY }}

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
