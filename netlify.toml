[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "API_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy
    # - default-src 'self': baseline — only same-origin resources unless overridden
    # - script-src: same-origin bundles + Google Identity Services (OAuth)
    # - style-src: same-origin bundles + Google Fonts CSS
    # - font-src: Google Fonts static assets
    # - img-src: same-origin + data URIs (canvas capture for morphology photos)
    # - connect-src: all external APIs the app calls at runtime:
    #     Google OAuth userinfo, Drive v3 API, Gemini generative API,
    #     Open Food Facts product search, Google Fonts preconnect
    # - frame-src: accounts.google.com — used by IronSync silent token refresh iframe
    # - worker-src: 'self' — service worker registration
    # - object-src 'none': block Flash/plugin embeds entirely
    # - base-uri 'self': prevent base tag hijacking
    # - form-action 'self': prevent form submissions to external origins
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://generativelanguage.googleapis.com https://world.openfoodfacts.org https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

    # Prevent the app being embedded in iframes on other origins
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Restrict referrer information sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Limit browser feature access to only what the app actually needs:
    # - camera: Morphology Lab photo capture and Food Pantry label scan
    # - vibrate: haptic feedback on long-press set deletion
    # All other powerful features (microphone, geolocation, payment, etc.) blocked
    Permissions-Policy = "camera=(self), vibrate=(self), microphone=(), geolocation=(), payment=()"
